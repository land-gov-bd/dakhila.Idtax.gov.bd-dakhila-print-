<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>ভূমি উন্নয়ন কর: Dakhila</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta content="width=600, initial-scale=1.0, minimum-scale=1.0, maximum-scale=3.0, user-scalable=no" name="viewport">
    
    <link href="https://dakhila.ldtax.gov.bd/css/bootstrap.min.css" rel="stylesheet" type="text/css">
    <link href="https://dakhila.ldtax.gov.bd/css/components-rounded.css" rel="stylesheet" type="text/css">
    <link href="https://dakhila.ldtax.gov.bd/css/layout.css" rel="stylesheet" type="text/css">
    <link rel="shortcut icon" href="https://dakhila.ldtax.gov.bd/img/favicon.ico">

    <style>
        body { background-color: #e9e9e9; }
        .page-content { padding: 20px; }
        #printArea {
            width: 815px;
            height: 1050px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 5px;
            overflow: hidden;
        }
        /* PDF Viewer Styling */
        #pdfFrame {
            width: 100%;
            height: 100%;
            border: none;
        }
        .print-btn-container {
            display: flex;
            margin-bottom: 1.25rem;
            justify-content: center;
            align-items: center;
        }
        .print-btn {
            padding: 10px 25px;
            border-radius: 5px;
            color: #ffffff;
            background-color: #3B82F6;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="page-container">
        <div class="page-content">
            <div class="print-btn-container">
                <button class="print-btn" onclick="printPDF()">🖨️ প্রিন্ট করুন</button>
            </div>

            <div id="printArea">
                <iframe id="pdfFrame" src="https://land-gov-bd.github.io/dakhila.Idtax.gov.bd-dakhila-print-/dakhilaprint%2020260130.pdf"></iframe>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        function printPDF() {
            var iframe = document.getElementById('pdfFrame');
            try {
                // আইফ্রেমের কন্টেন্ট ফোকাস করে প্রিন্ট কমান্ড দেওয়া
                iframe.contentWindow.focus();
                iframe.contentWindow.print();
            } catch (e) {
                // যদি সরাসরি আইফ্রেম প্রিন্ট না হয়, তবে নতুন উইন্ডোতে খুলে প্রিন্ট হবে
                window.open(iframe.src, '_blank').print();
            }
        }
    </script>
</body>
</html>
